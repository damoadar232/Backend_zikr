# == Production profile ========================================================
# Activate with:  SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST be provided via environment variables.
# No hardcoded fallbacks for secrets exist in this file.

# -- Database - managed MySQL (no local defaults) -----------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -- JPA - no SQL logging in production -----------------------------------------
spring.jpa.show-sql=false

# -- JWT - secret must be provided via environment variable --------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiry-seconds=${JWT_ACCESS_EXPIRY_SECONDS:3600}
app.jwt.refresh-expiry-seconds=${JWT_REFRESH_EXPIRY_SECONDS:2592000}

# -- CORS - production frontend origins (no localhost) ------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# -- Admin provisioning --------------------------------------------------------
# AdminUserSeeder is disabled in production (@Profile("!prod")).
# The initial administrator must be provisioned via a direct database
# INSERT using BCrypt-hashed credentials. See deployment documentation.