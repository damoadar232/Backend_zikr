# == Common configuration (shared by all profiles) ============================
# Profile-specific settings live in application-local.properties and
# application-prod.properties. Activate a profile via
# SPRING_PROFILES_ACTIVE=local  or  SPRING_PROFILES_ACTIVE=prod

spring.application.name=zikrelahi-api
server.port=${PORT:8080}

# JPA - shared between local and production (Flyway manages the schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Flyway - shared migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Actuator - expose only the health endpoint, hide sensitive details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never